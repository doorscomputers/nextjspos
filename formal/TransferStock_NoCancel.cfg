\* Same as AllRoutes but without /cancel, so the checker reports the second
\* finding (a plain status update re-opening a finished transfer). Needs 4 requests.
CONSTANTS
  Reqs = {r1, r2, r3, r4}
  Routes = {"SendSync", "SendJob", "Receive", "CompleteSync", "CompleteJob",
            "MarkArrived", "StartVerify", "VerifyAll"}
  InitDeducted = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleTransferOut NoDoubleTransferIn NoDoubleCancelReturn NoStockFromNothing
