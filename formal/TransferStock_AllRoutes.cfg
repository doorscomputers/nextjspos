\* Every deployed transfer route under src/app/api/transfers/[id]/ that changes
\* stock or status, reachable by any logged-in user with the permission.
CONSTANTS
  Reqs = {r1, r2, r3, r4}
  Routes = {"SendSync", "SendJob", "Receive", "CompleteSync", "CompleteJob",
            "Cancel", "MarkArrived", "StartVerify", "VerifyAll",
            "VerifyItem", "UnverifyItem"}
  InitDeducted = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoDoubleTransferOut NoDoubleTransferIn NoDoubleCancelReturn NoStockFromNothing NoLostOnCancel
