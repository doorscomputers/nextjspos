\* Requests overlap. Checks only the approve-once properties (the claim guards),
\* leaving out NoOverReceive, which Receiving_Concurrent shows is broken.
CONSTANTS
  Reqs = {r1, r2, r3, r4}
  Grns = {g1, g2}
  Ordered = 2
  OtherDocs = {supplierReturn, replacement}
  OneAtATime = FALSE
SPECIFICATION Spec
INVARIANTS NoDoubleGrnApprove NoDoubleDocPosting
